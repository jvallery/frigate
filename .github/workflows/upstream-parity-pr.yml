name: Upstream parity

on:
  pull_request:
    branches:
      - vallery/prod
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character fork source SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-parity-${{ github.event.pull_request.number || inputs.source_sha || github.sha }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: "3.11"
  SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate exact source identity
        run: '[[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
      - name: Install lint dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r docker/main/requirements-dev.txt
      - name: Ruff formatting
        run: ruff format --check --diff frigate migrations docker ./*.py
      - name: Ruff lint
        run: ruff check frigate migrations docker ./*.py

  python-tests:
    name: Python unit, typing, and API spec
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Validate exact source identity
        run: '[[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Node for the pinned devcontainer CLI
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.x
      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.80.2
      - name: Build and start devcontainer
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          devcontainer build --workspace-folder .
          devcontainer up --workspace-folder .
      - name: Run mypy
        run: devcontainer exec --workspace-folder . bash -lc "python3 -u -m mypy --config-file frigate/mypy.ini frigate"
      - name: Verify generated API specification
        run: devcontainer exec --workspace-folder . bash -lc "python3 generate_api_auth_spec.py --check"
      - name: Run Python unit tests
        run: devcontainer exec --workspace-folder . bash -lc "python3 -u -m unittest"

  web-lint:
    name: Web lint and i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate exact source identity
        run: '[[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Lint web
        run: npm run lint
        working-directory: web
      - name: Verify i18n extraction
        run: npm run i18n:extract:ci
        working-directory: web

  web-build:
    name: Web production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate exact source identity
        run: '[[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build web
        run: npm run build
        working-directory: web

  web-e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate exact source identity
        run: '[[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]'
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: web
      - name: Build web for E2E
        run: npm run e2e:build
        working-directory: web
      - name: Run E2E tests
        run: npm run e2e
        working-directory: web
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-${{ github.run_id }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
