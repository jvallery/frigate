name: Upstream patch retirement

on:
  schedule:
    - cron: "43 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Detect exact upstream matches without creating an internal PR
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-patch-retirement
  cancel-in-progress: false

jobs:
  detect:
    name: Detect exact upstream patch matches
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_URL: https://github.com/blakeblackshear/frigate.git
    steps:
      - name: Check out reviewed retirement controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: vallery/prod
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the fixed upstream branch without executing it
        run: |
          set -euo pipefail
          branch="$(jq -er .selected_upstream.branch .vallery/downstream-patches.json)"
          case "${branch}" in dev|0.19) ;; *) exit 31 ;; esac
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_URL}"
          git fetch --no-tags upstream \
            "+refs/heads/${branch}:refs/remotes/upstream/${branch}"
          git fetch --no-tags origin \
            +refs/heads/vallery/prod:refs/remotes/origin/vallery/prod
          echo "UPSTREAM_BRANCH=${branch}" >> "${GITHUB_ENV}"

      - name: Detect complete stable patch-ID matches
        id: plan
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/patch-retirement"
          plan="${RUNNER_TEMP}/patch-retirement/plan.json"
          python3 .github/scripts/plan_upstream_patch_retirement.py \
            --upstream-ref "refs/remotes/upstream/${UPSTREAM_BRANCH}" \
            --output "${plan}"
          echo "candidate_count=$(jq -er .candidate_count "${plan}")" >> "${GITHUB_OUTPUT}"
          echo "upstream_tip=$(jq -er .upstream_tip "${plan}")" >> "${GITHUB_OUTPUT}"
          {
            echo "### Upstream patch-retirement scan"
            echo
            echo "- Selected base: \`$(jq -er .selected_sha "${plan}")\`"
            echo "- Upstream tip: \`$(jq -er .upstream_tip "${plan}")\`"
            echo "- Exact candidates: \`$(jq -er .candidate_count "${plan}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare the internal intake and retirement-candidate PR
        if: steps.plan.outputs.candidate_count != '0' && inputs.dry_run != true
        env:
          UPSTREAM_TIP: ${{ steps.plan.outputs.upstream_tip }}
        run: |
          set -euo pipefail
          [[ "${UPSTREAM_TIP}" =~ ^[0-9a-f]{40}$ ]]
          branch="automation/patch-retirement-${UPSTREAM_TIP:0:12}"
          plan="${RUNNER_TEMP}/patch-retirement/plan.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "${branch}" refs/remotes/origin/vallery/prod
          if ! git merge --no-ff --no-edit "${UPSTREAM_TIP}"; then
            git merge --abort
            echo "::error::upstream retirement intake conflicts with vallery/prod"
            exit 32
          fi
          python3 .github/scripts/plan_upstream_patch_retirement.py \
            --apply-plan "${plan}"
          python3 .github/scripts/verify_downstream_patch_ledger.py
          git add .vallery/downstream-patches.json
          git commit -m "chore(upstream): record exact upstream patch matches"
          gh auth setup-git
          git push --set-upstream origin "${branch}"

          candidate_list="$(jq -r '.candidates[] | "- `" + .patch_id + "` (`" + .concern + "`): " + ([.matches[].upstream_commit] | join(", "))' "${plan}")"
          body="$(printf '%s\n' \
            "Exact stable patch-ID matches were detected on upstream ${UPSTREAM_BRANCH}@${UPSTREAM_TIP}." \
            "" \
            "${candidate_list}" \
            "" \
            "This PR records the selected upstream base and marks matches as upstreamed, not retired. Duplicate downstream ownership must remain until the source, image, private preflight, production rollout, soak, and rollback gates prove the upstream implementation. No upstream issue, PR, discussion, review, or comment was written by this workflow." \
            "" \
            "Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          if ! gh pr view "${branch}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base vallery/prod \
              --head "${branch}" \
              --title "chore(upstream): prepare exact patch retirement at ${UPSTREAM_TIP:0:12}" \
              --body "${body}"
          fi

      - name: Upload immutable detection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-patch-retirement-${{ github.run_id }}
          path: ${{ runner.temp }}/patch-retirement/
          if-no-files-found: error
          retention-days: 90
