name: Vallery integration

on:
  pull_request:
    branches:
      - vallery/prod
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character fork source SHA
        required: true
        type: string
      source_branch:
        description: Mirror branch that supplied the source
        required: true
        type: choice
        options:
          - dev
          - 0.19
      upstream_sha:
        description: Full 40-character upstream source SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vallery-integration-${{ github.event.pull_request.number || inputs.source_sha || github.sha }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Exact source and classification contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
      UPSTREAM_SHA: ${{ inputs.upstream_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Validate immutable identities
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${UPSTREAM_SHA}" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Test the fail-closed classifier
        run: |
          python3 .github/scripts/test_classify_upstream_changes.py
          python3 .github/scripts/test_verify_mirror_update.py
      - name: Validate upstream policy
        run: |
          python3 -m json.tool .vallery/upstream-policy.json >/dev/null
          test "$(jq -r .upstream_repository .vallery/upstream-policy.json)" = "blakeblackshear/frigate"
          test "$(jq -r '.mirror_branches | join(",")' .vallery/upstream-policy.json)" = "dev,0.19"
      - name: Verify downstream patch ledger freshness
        run: |
          python3 .github/scripts/test_verify_downstream_patch_ledger.py
          python3 .github/scripts/verify_downstream_patch_ledger.py
      - name: Install pinned kubectl for offline desired-state validation
        env:
          KUBECTL_VERSION: v1.33.3
          KUBECTL_SHA256: 2fcf65c64f352742dc253a25a7c95617c2aba79843d1b74e585c69fe4884afb0
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/local-dev-tools"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output "${RUNNER_TEMP}/local-dev-tools/kubectl"
          echo "${KUBECTL_SHA256}  ${RUNNER_TEMP}/local-dev-tools/kubectl" | \
            sha256sum --check
          chmod 0755 "${RUNNER_TEMP}/local-dev-tools/kubectl"
          echo "${RUNNER_TEMP}/local-dev-tools" >> "${GITHUB_PATH}"
      - name: Verify isolated public Frigate development desired state
        run: |
          python3 .github/scripts/validate_local_dev_runtime.py
          python3 .github/scripts/test_local_dev_runtime.py
      - name: Verify protected release and artifact contracts
        run: |
          python3 .github/scripts/test_vallery_release_workflows.py
          python3 .github/scripts/test_plan_upstream_patch_retirement.py
          python3 -m json.tool .vallery/release-manifest.schema.json >/dev/null

  trust-boundary:
    name: Public runner trust boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove the untrusted lane has no private authorities
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = "github-hosted"
          test -z "${KUBECONFIG:-}"
          test -z "${DOCKER_CONFIG:-}"
          test "${EVENT_NAME}" != "pull_request_target"
